# cotml-proxy: deny-by-default egress proxy.
# Allow only: CONNECT api.anthropic.com:443. Deny all other requests.

http_port 8888

acl CONNECT method CONNECT
acl allowed_port port 443
# -n: do not reverse-resolve IP literals; "CONNECT <ip>:443" does not match.
# No leading dot: subdomains of api.anthropic.com do not match.
acl allowed_host dstdomain -n api.anthropic.com

http_access allow CONNECT allowed_port allowed_host
http_access deny all

# No caching, no client-identifying headers.
cache deny all
forwarded_for delete

# Log every request (allowed: TCP_TUNNEL; denied: TCP_DENIED/403).
logformat cotml %{%Y-%m-%dT%H:%M:%S}tl %>a %Ss/%03>Hs %rm %ru %<a
access_log daemon:/var/log/squid/access.log cotml
cache_log /var/log/squid/cache.log
logfile_rotate 0
coredump_dir /var/spool/squid
shutdown_lifetime 1 seconds
pinger_enable off

# Resolve upstream directly; Docker embedded DNS (127.0.0.11) was observed to stop answering after ~40 min.
dns_nameservers 8.8.8.8 8.8.4.4
positive_dns_ttl 5 minutes
negative_dns_ttl 1 seconds
